# Baut die Windows-EXE und veroeffentlicht sie als GitHub-Release.
#
# Ein neues Release entsteht automatisch, sobald auf main eine Version in
# Cargo.toml steht, fuer die es noch kein Release gibt. Fuer ein Update also
# einfach die Versionsnummer in Cargo.toml erhoehen und pushen.
# Manuell starten geht auch: Actions → Release → "Run workflow".
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version ermitteln
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          "tag=v$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release v$v existiert bereits – nichts zu tun."
            "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Neues Release v$v wird gebaut."
            "skip=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Rust aktualisieren
        if: steps.ver.outputs.skip == 'false'
        run: rustup update stable --no-self-update && rustup default stable

      - name: Release bauen
        if: steps.ver.outputs.skip == 'false'
        run: cargo build --release --locked

      - name: Datei vorbereiten
        if: steps.ver.outputs.skip == 'false'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/maus-utility.exe dist/maus-utility.exe
          Get-FileHash dist/maus-utility.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  maus-utility.exe" } |
            Out-File -Encoding ascii dist/maus-utility.exe.sha256

      - name: GitHub-Release erstellen
        if: steps.ver.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Maus-Utility ${{ steps.ver.outputs.tag }}
          files: |
            dist/maus-utility.exe
            dist/maus-utility.exe.sha256
          body: |
            Windows-Build (64 Bit) – einfach `maus-utility.exe` herunterladen und starten.

            **Funktionen:** Autoclicker mit Intervall und Zufall-Offset, Dauerklick, Farb-Trigger mit Toleranz, Klick-Offset und Cooldown, Klickfolgen (speicher- und ladbar), Cursor-Info mit Merkliste (Strg+C), Hell-/Dunkelmodus und Tray-Icon.

            Windows SmartScreen kann beim ersten Start warnen, weil die Datei nicht signiert ist: *Weitere Informationen → Trotzdem ausführen*.
